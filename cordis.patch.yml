# Bundle patch layer: one row loads this package's main entry (the Host half).
# The entry name resolves against this package directory; `dsh.client.platform`
# in package.json makes the web app load ./client as the browser half.
# Entry id is globally unique — a duplicate id is filtered out of the settings editor.
- insert:
    - id: dsh-prompt-refine
      name: dsh-prompt-refine
